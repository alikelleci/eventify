server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects keep the host and port the browser used (e.g. /console -> /console/ with -p 8080:80).
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / {
        return 302 /console/;
    }

    # The app shell: Angular routes fall back to index.html. no-cache makes the browser check for a new version
    # on every visit, so after an upgrade it never runs an old index.html that points to files that are gone.
    location /console/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /console/index.html;
    }

    # Generated at startup from the mounted config file.
    location = /console/config.json {
        add_header Cache-Control "no-store";
    }

    # Build output with a content hash in its name never changes, so it can be cached for good.
    # A missing one (e.g. from a previous version) is a real 404, not the app's HTML.
    location ~ "^/console/(media/)?[^/]+-[A-Z0-9]{8}\.(js|css|woff2?|ttf|eot|svg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
