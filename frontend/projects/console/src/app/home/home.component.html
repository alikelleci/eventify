<div class="h-full overflow-y-auto">
  <div class="flex-1 flex flex-col items-center justify-center px-6 py-12">
    <div class="max-w-2xl w-full">
      <!-- The applications connected to this console, live -->
      <div class="mx-auto mb-10 max-w-md">
        <app-connected-apps [apps]="connectedApps()" />
        <p class="mt-3 text-center text-xs text-surface-400">{{ connectedLabel() }}</p>
      </div>

      <!-- Heading -->
      <h1 class="text-center text-3xl font-semibold text-surface-900 dark:text-surface-0 mb-3">
        See what happened
      </h1>

      <!-- Description -->
      <p class="text-center text-base text-surface-500 dark:text-surface-400 mb-8">
        Search any aggregate to see all its events, its state at any moment, and why each command succeeded or failed.
      </p>

      <!-- Search button -->
      <div class="flex justify-center mb-12">
        <p-button label="Search an aggregate" icon="pi pi-search" size="large" (onClick)="search.focusSearch()" />
      </div>

      <!-- Quick reference cards -->
      <div class="grid gap-4 sm:grid-cols-3">
        <div class="rounded-xl border border-surface-200 p-4 dark:border-surface-700">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-50 text-primary-600 dark:bg-primary-950 dark:text-primary-400 mb-3">
            <i class="pi pi-list text-sm"></i>
          </div>
          <h3 class="text-xs font-semibold uppercase tracking-wide text-surface-700 dark:text-surface-200 mb-1">Event history</h3>
          <p class="text-xs text-surface-500 dark:text-surface-400">Complete event history in order</p>
        </div>
        <div class="rounded-xl border border-surface-200 p-4 dark:border-surface-700">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-50 text-primary-600 dark:bg-primary-950 dark:text-primary-400 mb-3">
            <i class="pi pi-database text-sm"></i>
          </div>
          <h3 class="text-xs font-semibold uppercase tracking-wide text-surface-700 dark:text-surface-200 mb-1">State snapshots</h3>
          <p class="text-xs text-surface-500 dark:text-surface-400">Aggregate state at any point</p>
        </div>
        <div class="rounded-xl border border-surface-200 p-4 dark:border-surface-700">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-50 text-primary-600 dark:bg-primary-950 dark:text-primary-400 mb-3">
            <i class="pi pi-send text-sm"></i>
          </div>
          <h3 class="text-xs font-semibold uppercase tracking-wide text-surface-700 dark:text-surface-200 mb-1">Command traces</h3>
          <p class="text-xs text-surface-500 dark:text-surface-400">Commands and their outcomes</p>
        </div>
      </div>
    </div>
  </div>
</div>
