<div class="h-full overflow-y-auto">
  <div class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:py-8">
    <h1 class="sr-only">Connected applications</h1>

    <!-- The totals -->
    <dl class="grid grid-cols-2 gap-3 sm:grid-cols-4">
      @for (stat of stats(); track stat.label) {
        <div class="rounded-2xl border border-surface-200 px-5 py-4 dark:border-surface-800">
          <dt class="text-xs font-medium uppercase tracking-widest text-surface-400">{{ stat.label }}</dt>
          <dd class="mt-1 text-3xl font-semibold tabular-nums"
              [class]="stat.warn && stat.value !== '0' ? 'text-amber-500' : 'text-surface-900 dark:text-surface-0'">{{ stat.value }}</dd>
        </div>
      }
    </dl>

    <!-- The centre: the console with its applications, live -->
    <section class="home-stage mt-4 rounded-2xl border border-surface-200 px-4 py-10 sm:px-8 sm:py-12 dark:border-surface-800">
      <app-connected-apps [apps]="connectedApps()" class="mx-auto block max-w-xl" />
    </section>
  </div>
</div>
