name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check release validation and publication recovery
        run: node --test .github/scripts/*.test.cjs

      # Exercise release sources/javadocs packaging without signing or publishing.
      # Integration tests still run in the verify phase.
      - name: Build and test release artifacts
        run: mvn --batch-mode verify -Prelease -Dgpg.skip=true

  docker:
    name: Build Docker Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: eventify-console-server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: eventify-console:ci-${{ matrix.arch }}
          load: true
          push: false

  website:
    name: Build Website and Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build website
        working-directory: frontend
        run: |
          npm ci
          npm run build:website -- --base-href /eventify/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build docs
        run: |
          python -m pip install mkdocs-material
          mkdocs build --site-dir site-docs

      - name: Assemble site
        run: |
          mkdir -p public
          cp -r frontend/dist/website/browser/. public/
          cp -r site-docs public/docs
          # Keep direct navigation to the website's console route working.
          mkdir -p public/console
          cp public/index.html public/console/index.html
          cp public/index.html public/404.html
          touch public/.nojekyll

      # PRs validate the build; only trusted main pushes provide deployable artifacts.
      - name: Upload website and docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: website-and-docs
          path: public/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  required:
    name: Required CI
    needs: [build, docker, website]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$WEBSITE_RESULT" = success
