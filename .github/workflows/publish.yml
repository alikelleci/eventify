name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

# Other versions can build independently, but duplicate runs for a version wait.
concurrency:
  group: publish-${{ github.ref }}
  queue: max
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alikelleci/eventify-console

jobs:
  prepare:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate release version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const { validateRelease } = require('./.github/scripts/release.cjs');
            const release = context.payload.release;
            core.setOutput('version', validateRelease(release.tag_name, release.prerelease));

  build-maven:
    name: Verify Maven Release
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test release artifacts
        run: mvn --batch-mode --no-transfer-progress verify -Prelease -Dgpg.skip=true

  build-docker:
    name: Build Release Image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: eventify-console-server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: RELEASE_VERSION=${{ needs.prepare.outputs.version }}
          tags: eventify-console:release-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=docker,dest=${{ runner.temp }}/console-${{ matrix.arch }}.tar
          provenance: false

      - name: Save built image for publication
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.arch }}
          path: ${{ runner.temp }}/console-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  publish-maven:
    name: Publish Maven
    needs: [prepare, build-maven, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js for publication checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for an already published Maven release
        id: central
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node .github/scripts/maven-publication.cjs check "$VERSION"

      - name: Set up JDK 17 and signing
        if: steps.central.outputs.published == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version
        if: steps.central.outputs.published == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode --no-transfer-progress -N versions:set-property \
            -Dproperty=eventify.release.commit -DnewVersion="$GITHUB_SHA" -DgenerateBackupPoms=false

      - name: Publish signed packages
        id: deploy
        if: steps.central.outputs.published == 'false'
        # A lost status response can fail Maven after Central has published.
        # The next step succeeds only if the complete release is actually visible.
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress deploy -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Confirm complete Maven publication or recover a lost response
        if: steps.central.outputs.published == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node .github/scripts/maven-publication.cjs wait "$VERSION"

  publish-docker:
    name: Publish Docker Image
    needs: [prepare, build-maven, build-docker, publish-maven]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download verified images
        uses: actions/download-artifact@v4
        with:
          pattern: console-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish previously built images
        run: |
          for ARCH in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/console-$ARCH.tar"
            docker tag "eventify-console:release-$ARCH" "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
            docker push "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          done

      - name: Publish multi-platform release tag
        id: manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
            "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  promote-latest:
    name: Update Latest Stable Image
    needs: [prepare, publish-maven, publish-docker]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Evaluate inside this lock; never interrupt publication or discard a waiter.
    concurrency:
      group: eventify-console-latest
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js for publication checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check successfully published stable images
        id: latest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/docker-publication.cjs

      - name: Set up Docker Buildx
        if: steps.latest.outputs.promote == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.latest.outputs.promote == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified release manifest to latest
        if: steps.latest.outputs.promote == 'true'
        env:
          DIGEST: ${{ needs.publish-docker.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
