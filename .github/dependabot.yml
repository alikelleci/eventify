# Weekly updates of the dependencies, grouped so they come as a few pull requests, not dozens: CI tests each one.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ['*']
    # Eventify is a library: a major version of a dependency (Spring Boot, kafka-clients) changes what its users
    # get, so that is a decision, made by hand, not a weekly update. Security updates still come.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'typescript', 'zone.js']
      primeng:
        patterns: ['primeng', 'primeicons', '@primeuix/*', 'tailwindcss-primeui']
      other:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /eventify-console-server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
