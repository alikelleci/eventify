site_name: Eventify | Docs
site_url: https://alikelleci.github.io/eventify/docs/
site_description: Event sourcing for Java, built on Kafka
site_author: Ali Kelleci
repo_name: alikelleci/eventify
repo_url: https://github.com/alikelleci/eventify

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - tables
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra:
  # The logo links back to the website; the docs are published under its /docs/ path (see .github/workflows/pages.yml).
  homepage: https://alikelleci.github.io/eventify/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alikelleci/eventify
    - icon: material/language-java
      link: https://central.sonatype.com/artifact/io.github.alikelleci/eventify-core

copyright: Copyright &copy; Ali Kelleci

nav:
  - Overview: index.md
  - Start:
      - Getting started: getting-started.md
      - Spring Boot: spring-boot.md
  - Guides:
      - Domain modeling: domain-modeling.md
      - Handlers: handlers.md
      - Command gateway: command-gateway.md
      - Snapshots and upcasting: advanced.md
      - Testing: testing.md
  - Tools:
      - Eventify Console: console.md
  - Reference:
      - Annotations: annotation-reference.md
